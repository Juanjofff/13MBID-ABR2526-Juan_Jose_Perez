# Configuración de despliegue en Render
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: api-prediccion-bancaria
    runtime: python
    # Render usa uv sync (por uv.lock); uv.lock no tenía uvicorn → instalar en el mismo .venv
    buildCommand: uv sync && .venv/bin/pip install "uvicorn[standard]"
    startCommand: bash run.sh
    # Carpeta donde están app/ y models/ (raíz del repo)
    # envVars: si necesitas variables de entorno, añádelas en el dashboard de Render
